<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AnsweringNow.AI — Live Call Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Caveat:wght@600;700&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   AnsweringNow.AI — Live Call Widget (standalone HTML + CSS + JS)
   Mockup replica: caller card + channel pills on the left,
   narrow phone on the right, dotted connectors between them.
   ============================================================ */
html, body { margin: 0; }
body {
  background: #ffffff;
  font-family: "Inter", system-ui, sans-serif;
  padding: 24px 12px;
}
@media (max-width: 720px) { body { padding: 14px 6px; } html, body { overflow-x: hidden; } }

/* ------------------------------------------------------------
   MOBILE STRATEGY: the widget keeps its exact 720px desktop
   layout and is uniformly scaled down to fit smaller screens.
   .an-scaler measures the available width, .an-wrap is scaled.
   ------------------------------------------------------------ */
.an-scaler {
  position: relative;
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  overflow: visible;
}

.an-wrap {
  --an-blue: #1668e3;
  --an-blue-deep: #0b3f96;
  --an-green: #6dc10a;
  --an-green-soft: #eaf8d8;
  --an-ink: #10233f;
  --an-muted: #7086a3;
  --an-line: #e4ebf5;
  --an-bubble-ai: #e8f1fe;
  --an-shell: #0e1622;
  --an-card: #ffffff;
  --an-red: #ff2d20;
  --an-font: "Inter", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;

  position: absolute;
  top: 0;
  left: 0;
  width: 720px;
  transform: scale(var(--an-scale, 1));
  transform-origin: top left;
  font-family: var(--an-font);
  color: var(--an-ink);
  container-type: inline-size;
}
.an-wrap *, .an-wrap *::before, .an-wrap *::after { box-sizing: border-box; }

.an-wrap::before {
  content: "";
  position: absolute;
  inset: 6% -6% -8% -6%;
  border-radius: 60px;
  background:
    radial-gradient(60% 60% at 75% 70%, rgba(22,104,227,.22), transparent 70%),
    radial-gradient(50% 50% at 18% 28%, rgba(109,193,10,.16), transparent 70%);
  filter: blur(48px);
  pointer-events: none;
  z-index: 0;
}

/* left rail sits closer to the phone: tighter gap, wider phone column share */
.an-stage {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: minmax(0, .72fr) minmax(0, 1fr);
  align-items: center;
}

/* connector overlay (lines + dots) sits behind content */
.an-connect {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
  overflow: visible;
}

/* ---------------- Left rail ---------------- */
.an-left { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 16px; min-width: 0; align-self: stretch; justify-content: center; }

.an-caller { position: relative; display: flex; align-items: flex-start; gap: 10px; }
.an-caller-avatar {
  position: relative; flex: 0 0 auto;
  width: 84px; height: 84px; border-radius: 999px;
  border: 3px solid var(--an-blue);
  background: #fff;
  display: grid; place-items: center;
  animation: an-float 6s ease-in-out infinite;
}
.an-caller-avatar > img { width: 100%; height: 100%; border-radius: 999px; object-fit: cover; object-position: 50% 14%; }
.an-caller-avatar .an-phone-dot {
  position: absolute; right: -10px; bottom: -8px;
  width: 34px; height: 34px; border-radius: 999px;
  background: var(--an-green); color: #fff; display: grid; place-items: center;
  border: 3px solid #fff;
  box-shadow: 0 8px 16px -6px rgba(109,193,10,.8);
}
.an-caller-avatar .an-phone-dot svg { width: 16px; height: 16px; }
.an-caller-avatar .an-waves { position: absolute; left: -24px; top: -12px; color: var(--an-blue); opacity: .9; }

.an-caller-bubble {
  position: relative;
  background: var(--an-card); border: 1px solid var(--an-line);
  border-radius: 18px; padding: 12px 14px;
  box-shadow: 0 18px 34px -26px rgba(11,63,150,.7);
  animation: an-float 7s ease-in-out infinite;
}
.an-caller-bubble::after {
  content: "";
  position: absolute; left: 14px; bottom: -9px;
  width: 18px; height: 18px;
  background: var(--an-card);
  border-right: 1px solid var(--an-line);
  border-bottom: 1px solid var(--an-line);
  transform: rotate(45deg) skew(-6deg, -6deg);
  border-bottom-right-radius: 4px;
}
.an-caller-bubble em { display: block; font-style: normal; font-size: 12px; font-weight: 700; color: var(--an-blue); margin-bottom: 3px; }
.an-caller-bubble p { margin: 0; font-size: 13px; line-height: 1.45; font-weight: 800; color: var(--an-blue-deep); }

.an-channels { display: flex; flex-direction: column; gap: 12px; align-items: stretch; }

/* interactive channel pills */
.an-chan {
  position: relative;
  display: flex; align-items: center; gap: 12px;
  padding: 6px 16px 6px 6px;
  width: 70%; max-width: 100%;
  border-radius: 999px;
  background: linear-gradient(180deg, #fff, #f7fbff);
  border: 1px solid var(--an-line);
  box-shadow: 0 16px 30px -24px rgba(11,63,150,.9), 0 1px 0 rgba(255,255,255,.9) inset;
  animation: an-float 6.4s ease-in-out infinite;
  transition: transform .28s cubic-bezier(.2,.8,.3,1), box-shadow .28s ease, border-color .28s ease;
  cursor: pointer;
  overflow: hidden;
  will-change: transform;
  left: 83px;
}
.an-chan::after { /* sheen sweep */
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,.85) 48%, transparent 66%);
  transform: translateX(-120%);
  transition: transform .7s ease;
  pointer-events: none;
}
.an-chan:hover::after { transform: translateX(120%); }
.an-chan:nth-child(1) { animation-delay: 0s; }
.an-chan:nth-child(2) { animation-delay: .5s; }
.an-chan:nth-child(3) { animation-delay: 1s; }
.an-chan:nth-child(4) { animation-delay: 1.5s; }
.an-chan:hover, .an-chan.is-live {
  transform: translateX(5px) scale(1.03);
  border-color: rgba(22,104,227,.35);
  box-shadow: 0 22px 38px -22px rgba(11,63,150,.65);
}
.an-chan.is-live .an-chan-ico { box-shadow: 0 0 0 6px rgba(22,104,227,.14); }
.an-chan.is-live.green .an-chan-ico { box-shadow: 0 0 0 6px rgba(109,193,10,.16); }

.an-chan-ico {
  position: relative;
  flex: 0 0 auto; width: 46px; height: 46px; border-radius: 999px;
  display: grid; place-items: center;
  background: linear-gradient(150deg, #2f86ff, var(--an-blue-deep));
  color: #fff;
  transition: box-shadow .3s ease, transform .3s ease;
}
.an-chan:hover .an-chan-ico { transform: rotate(-6deg) scale(1.06); }
.an-chan-ico svg { width: 23px; height: 23px; }
.an-chan-ico.is-green { background: linear-gradient(150deg, #45c14b, #128a37); }
.an-chan-ico .an-chan-badge {
  position: absolute; right: -6px; bottom: -4px;
  width: 22px; height: 22px; border-radius: 999px;
  background: var(--an-green); color: #fff;
  display: grid; place-items: center; border: 2px solid #fff;
}
.an-chan-ico .an-chan-badge svg { width: 11px; height: 11px; }
.an-chan b { font-size: 13.5px; font-weight: 800; line-height: 1.2; color: var(--an-blue-deep); min-width: 0; }
.an-chan i.an-dot {
  margin-left: auto; width: 8px; height: 8px; border-radius: 999px; flex: 0 0 auto;
  background: var(--an-line); transition: background .3s ease, box-shadow .3s ease;
}
.an-chan.is-live i.an-dot { background: var(--an-green); box-shadow: 0 0 0 4px rgba(109,193,10,.18); }

/* ---------------- Phone (narrow) ---------------- */
.an-phone-col {
  position: relative;
  z-index: 1;
  justify-self: center;
  width: 100%;
  max-width: 268px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.an-phone {
  position: relative;
  width: 93%;
  border-radius: 40px;
  padding: 8px;
  background: linear-gradient(160deg, #2b3442, var(--an-shell));
  box-shadow: 0 40px 70px -34px rgba(8,22,45,.75), 0 0 0 1px rgba(255,255,255,.06) inset;
}
.an-screen {
  position: relative; border-radius: 33px; background: var(--an-card);
  overflow: hidden; display: flex; flex-direction: column;
}

.an-status {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 15px 3px; font-size: 11px; font-weight: 700;
}
.an-notch { width: 66px; height: 17px; border-radius: 999px; background: var(--an-shell); position: relative; left: 8px; }
.an-status-icons { display: flex; align-items: center; gap: 4px; }
.an-status-icons svg { width: 13px; height: 13px; }

.an-topbar {
  display: grid; grid-template-columns: 28px minmax(0,1fr) 28px;
  align-items: center; gap: 6px; padding: 4px 12px 6px;
}
.an-round {
  width: 28px; height: 28px; border: 0; border-radius: 999px;
  background: var(--an-bubble-ai); color: var(--an-blue);
  display: grid; place-items: center;
}
.an-round svg { width: 14px; height: 14px; }
.an-live { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13.5px; font-weight: 800; color: var(--an-blue); }
.an-live i { width: 8px; height: 8px; border-radius: 999px; background: var(--an-green); animation: an-pulse 1.6s ease-in-out infinite; }

/* brand / logo header inside the screen */
.an-brand {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 12px 6px;
}
.an-brand-icon { flex: 0 0 auto; width: 44px; height: 44px; display: grid; place-items: center; }
.an-brand-icon img { width: 100%; height: 100%; object-fit: contain; }
.an-brand-text { min-width: 0; display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }
.an-brand-name { font-size: 15px; font-weight: 900; color: var(--an-blue); letter-spacing: -.2px; white-space: nowrap; }
.an-brand-name span { color: var(--an-green); }
.an-badge {
  font-size: 10px; font-weight: 800; color: #3c6b12;
  background: var(--an-green-soft); border-radius: 999px; padding: 3px 9px;
  white-space: nowrap;
}

/* ---------------- Transcript ---------------- */
.an-chat {
  flex: 1 1 auto; min-height: 0; height: 226px; overflow-y: auto;
  padding: 8px 11px 8px; display: flex; flex-direction: column; gap: 8px;
  scrollbar-width: thin;
}
.an-chat::-webkit-scrollbar { width: 4px; }
.an-chat::-webkit-scrollbar-thumb { background: var(--an-line); border-radius: 999px; }
.an-row { display: flex; align-items: flex-end; gap: 6px; max-width: 95%; animation: an-in .32s ease both; }
.an-row.agent { align-self: flex-start; }
.an-row.caller { align-self: flex-end; flex-direction: row-reverse; }
.an-av { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 999px; display: grid; place-items: center; overflow: hidden; }
.an-av img { width: 100%; height: 100%; object-fit: cover; }
.an-row.agent .an-av { background: #fff; }
.an-row.agent .an-av img { object-fit: contain; }
.an-row.caller .an-av { background: #fff; box-shadow: 0 0 0 1px var(--an-line); }
.an-row.caller .an-av img { object-position: 50% 14%; }
.an-bubble { padding: 8px 11px; border-radius: 14px; font-size: 11.5px; line-height: 1.45; font-weight: 700; }
.an-row.agent .an-bubble { background: var(--an-bubble-ai); color: var(--an-blue-deep); border-bottom-left-radius: 6px; }
.an-row.caller .an-bubble { background: var(--an-green-soft); color: #2f4b12; border-bottom-right-radius: 6px; }
.an-typing { display: flex; gap: 5px; padding: 10px 12px; border-radius: 14px; }
.an-typing.agent { align-self: flex-start; background: var(--an-bubble-ai); }
.an-typing.caller { align-self: flex-end; background: var(--an-green-soft); }
.an-typing i { width: 6px; height: 6px; border-radius: 999px; background: var(--an-muted); animation: an-dot 1.1s infinite; }
.an-typing i:nth-child(2) { animation-delay: .15s; }
.an-typing i:nth-child(3) { animation-delay: .3s; }

/* ---------------- Waveform (above controls, like the mockup) ---------------- */
.an-wavebar { padding: 2px 12px 2px; }
.an-wave { display: flex; align-items: center; gap: 2px; height: 38px; cursor: pointer; }
.an-wave b {
  display: block; flex: 1 1 auto; min-width: 2px; border-radius: 999px;
  background: rgba(22,104,227,.18); transform-origin: center; transition: background .15s linear;
}
.an-wave b.on { background: var(--an-blue); }
.an-wave b.on.mid { background: var(--an-green); }
.an-wave.playing b.on { animation: an-bar .62s ease-in-out infinite; }
.an-times {
  display: flex; justify-content: space-between; padding: 2px 2px 0;
  font: 700 9.5px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
  color: var(--an-muted); font-variant-numeric: tabular-nums;
}

/* ---------------- Controls ---------------- */
.an-controls { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 8px 12px 16px; }
.an-ctl {
  width: 44px; height: 44px; border: 0; border-radius: 999px;
  background: var(--an-bubble-ai); color: var(--an-blue);
  display: grid; place-items: center; cursor: pointer;
  transition: transform .18s ease, background .18s ease, color .18s ease;
}
.an-ctl svg { width: 21px; height: 21px; }
.an-ctl:hover { transform: translateY(-2px) scale(1.04); }
.an-ctl:focus-visible { outline: 3px solid rgba(22,104,227,.35); outline-offset: 3px; }
.an-ctl.is-active { background: var(--an-blue); color: #fff; }
.an-ctl.is-play { background: var(--an-green); color: #fff; }
.an-ctl.is-end { background: #f0453a; color: #fff; cursor: default; }
.an-ctl.is-end:hover { transform: none; }
.an-ctl.is-ringing { position: relative; }
.an-ctl.is-ringing::after {
  content: ""; position: absolute; inset: -4px; border-radius: 999px;
  border: 2px solid rgba(255,45,32,.6); animation: an-ping 1.6s ease-out infinite;
}

/* ---------------- CTA below the phone ---------------- */
.an-cta {
  position: relative;
  margin-top: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  z-index: 3;
  right:80px;
  bottom:45px;
  pointer-events: none;
  color: var(--an-red);
  width: 86%;
}
.an-cta svg.an-cta-arrow { display: block; width: 58px; height: 64px; }
.an-cta svg.an-cta-arrow path {
  stroke-dasharray: 240; stroke-dashoffset: 240;
  animation: an-draw 1.4s ease forwards .4s;
}
.an-cta span {
  display: block;
  font-family: "Caveat", "Segoe Script", cursive;
  font-size: clamp(21px, 4cqw, 32px);
  font-weight: 700;
  line-height: 1.05;
  text-align: center;
  transform: rotate(-3deg);
  text-shadow: 0 2px 10px rgba(255,45,32,.18);
  position: relative;
  left: 76px;
  bottom: 22px;
}
.an-cta.is-done { opacity: 0; transition: opacity .4s ease; }

/* ---------------- Animations ---------------- */
@keyframes an-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes an-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes an-dot { 0%,60%,100% { opacity: .3; } 30% { opacity: 1; } }
@keyframes an-ping { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(1.32); opacity: 0; } }
@keyframes an-bar { 0%,100% { transform: scaleY(.7); } 50% { transform: scaleY(1.3); } }
@keyframes an-pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes an-draw { to { stroke-dashoffset: 0; } }
@keyframes an-flow { to { stroke-dashoffset: -24; } }
@media (prefers-reduced-motion: reduce) { .an-wrap * { animation: none !important; } }

/* ---------------- Responsive ----------------
   No layout reflow on mobile: the whole widget is scaled
   proportionally by JS (--an-scale), so the mobile UI is an
   exact miniature of the desktop UI. Only touch ergonomics
   are nudged below. */
@media (hover: none) {
  .an-chan:hover { transform: none; }
  .an-chan:active { transform: translateX(5px) scale(1.03); }
  .an-ctl:hover { transform: none; }
  .an-ctl:active { transform: scale(.94); }
}
@media (max-width: 720px) {
  .an-left { display: none; }
  .an-connect { display: none; }
  .an-stage { grid-template-columns: minmax(0, 1fr); }
}
@supports not (container-type: inline-size) {
  @media (max-width: 720px) {
    .an-stage { grid-template-columns: minmax(0, .68fr) minmax(0, 1fr); gap: 8px; }
  }
}
</style>
</head>
<body>

<div data-an-widget></div>

<script>
(function () {
  "use strict";

  /* ---- CONFIG ---- */
  var CALL = {
    audio: "ai-agent-conversation-2.mp3",
  logo: "AnsweringNowAI-Logo.webp",
  icon: "AnsweringNowAI-Logo-Icon.jpg",
  woman: "caller-woman.png",
    fallbackDuration: 46,
    lines: [
      { t: 0.0, who: "agent", text: "Hi, thanks for calling the salon. This is Mia. How can I help today?" },
      { t: 4.9, who: "caller", text: "Hi, so I had a couple of questions. Do you, um, do hair colour?" },
      { t: 10.7, who: "agent", text: "Yes, we do hair colour appointments \u2014 full colour, root touch-ups, highlights and colour refreshes." },
      { t: 17.7, who: "caller", text: "Okay, okay. And can I add a trim with that?" },
      { t: 21.8, who: "agent", text: "Yes, a trim can usually be added with a colour appointment." },
      { t: 25.5, who: "caller", text: "Great, that's what I need. What are, like, your usual working hours?" },
      { t: 30.9, who: "agent", text: "We usually open Monday to Saturday, from 9am to 6pm." },
      { t: 35.0, who: "caller", text: "Alright, and are you open on Sunday by any chance?" },
      { t: 39.1, who: "agent", text: "No, we're closed on Sundays." },
      { t: 42.5, who: "caller", text: "Okay, no worries. I want to book an appointment for a hair colour then." },
      { t: 47.3, who: "agent", text: "Sure, I can help book that in. May I please take your name?" },
      { t: 53.0, who: "caller", text: "It's Sarah." },
      { t: 57.2, who: "agent", text: "Thanks, Sarah. And your mobile number?" },
      { t: 60.9, who: "caller", text: "Yep, it's on the way through now." },
      { t: 66.1, who: "agent", text: "When would you like to come in for the appointment?" },
      { t: 69.0, who: "caller", text: "So, um, do you have something for Saturday morning?" },
      { t: 72.9, who: "agent", text: "Yes, for Saturday morning we have 9:30am and 11am available." },
      { t: 77.9, who: "caller", text: "Yeah, 9:30 works." },
      { t: 79.2, who: "agent", text: "Perfect. We'll book you for Saturday at 9:30am for hair colour. You'll receive a confirmation by text." },
      { t: 81.1, who: "caller", text: "Amazing, thank you. I'll be there." },
      { t: 83.0, who: "agent", text: "You're welcome, Sarah. Have a nice day." },
    ]
  };

  var BARS = 52, HEIGHTS = [];
  for (var i = 0; i < BARS; i++) {
    var w = Math.sin(i * 0.55) * Math.cos(i * 0.19) * Math.sin(i * 0.09 + 1);
    HEIGHTS.push(Math.round(8 + Math.abs(w) * 28));
  }

  var ICON = {
    play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2c0-.9 1-1.5 1.8-1L19 11c.7.5.7 1.5 0 2l-9.2 6c-.8.5-1.8-.1-1.8-1z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.4"/><rect x="13.5" y="5" width="4" height="14" rx="1.4"/></svg>',
    sound: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 9H3v6h3.5L11 19z"/><path d="M16 9.2a4 4 0 0 1 0 5.6"/><path d="M18.8 6.5a8 8 0 0 1 0 11"/></svg>',
    muted: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 9H3v6h3.5L11 19z"/><path d="m16 9.5 5 5"/><path d="m21 9.5-5 5"/></svg>',
    keypad: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="6" r="1.7"/><circle cx="12" cy="6" r="1.7"/><circle cx="18" cy="6" r="1.7"/><circle cx="6" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18" cy="12" r="1.7"/><circle cx="6" cy="18" r="1.7"/><circle cx="12" cy="18" r="1.7"/><circle cx="18" cy="18" r="1.7"/></svg>',
    end: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 8.5c-3 0-5.9.7-8.2 2-1 .6-1.3 1.9-.7 2.8l.9 1.3c.5.7 1.4.9 2.2.6l2.2-.9c.7-.3 1.1-1 1.1-1.7v-1c1.6-.4 3.4-.4 5 0v1c0 .8.4 1.4 1.1 1.7l2.2.9c.8.3 1.7.1 2.2-.6l.9-1.3c.6-.9.3-2.2-.7-2.8-2.3-1.3-5.2-2-8.2-2z"/></svg>',
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6l-6 6 6 6"/></svg>',
    dots: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
    phone: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 3.5a1.6 1.6 0 0 1 2.2.5l1.5 2.4c.4.7.3 1.6-.3 2.1l-1 .9a11 11 0 0 0 4.6 4.6l.9-1c.5-.6 1.4-.7 2.1-.3l2.4 1.5c.8.5 1 1.5.5 2.2l-1.1 1.6c-.6.9-1.7 1.3-2.7 1A17.6 17.6 0 0 1 4.1 7.2c-.3-1 .1-2.1 1-2.7z"/></svg>',
    chatDot: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 5.5h16a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5h-8.6L7 20v-3.5H4A1.5 1.5 0 0 1 2.5 15V7A1.5 1.5 0 0 1 4 5.5z"/></svg>',
    globe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9S14.5 18.4 12 21c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>',
    whatsapp: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8a9.1 9.1 0 0 0-7.8 13.8L3 21.5l5.1-1.3A9.1 9.1 0 1 0 12 2.8zm5.1 12.8c-.2.6-1.2 1.2-1.7 1.2-.5.1-1 .1-1.6-.1-.4-.1-.9-.3-1.5-.6a10 10 0 0 1-3.8-3.4c-.4-.6-.8-1.4-.8-2.2 0-.8.4-1.2.6-1.4.2-.2.4-.3.6-.3h.4c.2 0 .3 0 .5.4l.7 1.6c0 .2 0 .3-.1.4l-.3.4c-.1.1-.2.2-.1.4.3.5.7 1 1.2 1.4.5.4 1 .7 1.5.9.2.1.3.1.4-.1l.6-.7c.1-.2.3-.2.4-.1l1.6.8c.2.1.3.2.4.3 0 .2 0 .6-.2 1.1z"/></svg>',
    social: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="3.8"/><circle cx="17" cy="7" r="1.2" fill="currentColor" stroke="none"/></svg>',
    signal: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="14" width="3" height="6" rx="1"/><rect x="7" y="11" width="3" height="9" rx="1"/><rect x="12" y="8" width="3" height="12" rx="1"/><rect x="17" y="5" width="3" height="15" rx="1"/></svg>',
    wifi: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 9a14 14 0 0 1 18 0"/><path d="M6.5 12.8a9 9 0 0 1 11 0"/><path d="M10 16.5a4 4 0 0 1 4 0"/><circle cx="12" cy="19.6" r="1.1" fill="currentColor"/></svg>',
    battery: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="17" height="9" rx="2.6" fill="currentColor"/><path d="M21.5 11.5v2"/></svg>',
    ripple: '<svg width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M31 3C22 6 15 13 12 22"/><path d="M25 2C17 5 10 12 7 20"/><path d="M19 1C12 4 6 10 3 18"/></svg>',
    upArrow: '<svg class="an-cta-arrow" viewBox="0 0 64 70" fill="none" aria-hidden="true">' +
      '<path d="M32 68C24 52 24 34 32 18" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>' +
      '<path d="M32 6l-10 14M32 6l10 14" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };

  var CHANNELS = [
    { icon: ICON.phone, label: "Phone Calls<br>&amp; SMS / Text", green: false, badge: true },
    { icon: ICON.globe, label: "Website Chat", green: false },
    { icon: ICON.whatsapp, label: "WhatsApp", green: true },
    { icon: ICON.social, label: "Social Media", green: false }
  ];

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function fmt(s) {
    if (!isFinite(s) || s < 0) s = 0;
    return Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
  }
  function mediaSrc(p) {
    if (!p) return "";
    if (/^https?:/i.test(p)) return p;
    return p.split("/").map(function (seg) { return encodeURIComponent(decodeURIComponent(seg)); }).join("/");
  }
  function timeLines(duration) {
    var weights = CALL.lines.map(function (l) { return Math.max(10, l.text.length); });
    var total = weights.reduce(function (a, b) { return a + b; }, 0);
    var acc = 0;
    CALL.lines.forEach(function (l, i) { l.t = (acc / total) * duration; acc += weights[i]; });
  }

  function mount(root) {
    root.classList.add("an-scaler");
    var wrap = document.createElement("div");
    wrap.className = "an-wrap";
    root.appendChild(wrap);

    wrap.innerHTML =
      '<svg class="an-connect" aria-hidden="true"></svg>' +
      '<div class="an-stage">' +
      '  <div class="an-left">' +
      '    <div class="an-caller">' +
      '      <div class="an-caller-avatar"><span class="an-waves">' + ICON.ripple + '</span><img src="' + CALL.woman + '" alt="Caller" />' +
      '        <span class="an-phone-dot">' + ICON.phone + '</span></div>' +
      '      <div class="an-caller-bubble"><em>New Customer</em>' +
      "        <p>Hello, I'd like to schedule an appointment for tomorrow. Do you have any availability?</p></div>" +
      '    </div>' +
      '    <div class="an-channels">' +
      CHANNELS.map(function (c) {
        return '<div class="an-chan' + (c.green ? " green" : "") + '" tabindex="0">' +
          '<span class="an-chan-ico' + (c.green ? " is-green" : "") + '">' + c.icon +
          (c.badge ? '<span class="an-chan-badge">' + ICON.chatDot + "</span>" : "") + "</span>" +
          "<b>" + c.label + "</b><i class=\"an-dot\"></i></div>";
      }).join("") +
      '    </div>' +
      '  </div>' +
      '  <div class="an-phone-col">' +
      '    <div class="an-phone">' +
      '      <div class="an-screen">' +
      '        <div class="an-status"><span>9:41</span><span class="an-notch"></span>' +
      '          <span class="an-status-icons">' + ICON.signal + ICON.wifi + ICON.battery + '</span></div>' +
      '        <div class="an-topbar"><span class="an-round">' + ICON.back + '</span>' +
      '          <span class="an-live"><i></i>Live Call</span>' +
      '          <span class="an-round">' + ICON.dots + '</span></div>' +
      '        <div class="an-brand">' +
      '          <span class="an-brand-icon"><img src="' + CALL.icon + '" alt="AnsweringNow.AI icon" /></span>' +
      '          <span class="an-brand-text">' +
      '            <span class="an-brand-name">AnsweringNow<span> AI</span></span>' +
      '            <span class="an-badge">Actively Engaged</span>' +
      '          </span>' +
      '        </div>' +
      '        <div class="an-chat" aria-live="polite"></div>' +
      '        <div class="an-wavebar">' +
      '          <div class="an-wave" role="slider" tabindex="0" aria-label="Seek call recording" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">' +
      HEIGHTS.map(function (h, i) {
        return '<b style="height:' + h + "px;animation-delay:" + ((i % 7) * 0.09).toFixed(2) + 's"></b>';
      }).join("") +
      '          </div>' +
      '          <div class="an-times"><span class="an-cur">0:00</span><span class="an-dur">0:00</span></div>' +
      '        </div>' +
      '        <div class="an-controls">' +
      '          <button class="an-ctl an-mute is-ringing" type="button" aria-label="Unmute call">' + ICON.muted + '</button>' +
      '          <span class="an-ctl" role="img" aria-label="Keypad (demo)">' + ICON.keypad + '</span>' +
      '          <button class="an-ctl is-play an-play" type="button" aria-label="Play call">' + ICON.play + '</button>' +
      '          <span class="an-ctl is-end" role="img" aria-label="End call button (demo)">' + ICON.end + '</span>' +
      '        </div>' +
      '      </div>' +
      '    </div>' +
      '    <div class="an-cta">' + ICON.upArrow + '<span>Unmute to hear<br>live calls</span></div>' +
      '  </div>' +
      '</div>' +
      '<video class="an-media" playsinline webkit-playsinline muted preload="auto" ' +
      'style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none"></video>';

    var $ = function (s) { return wrap.querySelector(s); };

    /* ---- proportional scaling: mobile = miniature desktop ----
       We measure the REAL painted bounds of the widget at 1:1 (which are
       wider than the 720px design box because of the offset pills, the CTA
       and the floating art), then scale + offset so nothing is ever cropped. */
    var DESIGN_W = 720;
    var scale = 1, box = null;

    function measureBox() {
      var prevScale = wrap.style.getPropertyValue("--an-scale");
      var prevLeft = wrap.style.left, prevTop = wrap.style.top;
      wrap.style.setProperty("--an-scale", 1);
      wrap.style.left = "0px";
      wrap.style.top = "0px";
      var w = wrap.getBoundingClientRect();
      var minL = 0, minT = 0, maxR = w.width, maxB = w.height;
      var nodes = wrap.querySelectorAll("*");
      for (var i = 0; i < nodes.length; i++) {
        if (nodes[i].classList.contains("an-media")) continue; /* off-screen audio proxy */
        var r = nodes[i].getBoundingClientRect();
        if (!r.width && !r.height) continue;
        if (r.width <= 1 || r.height <= 1) continue;
        var l = r.left - w.left, t = r.top - w.top;
        if (l < minL) minL = l;
        if (t < minT) minT = t;
        if (l + r.width > maxR) maxR = l + r.width;
        if (t + r.height > maxB) maxB = t + r.height;
      }
      box = { x: minL, y: minT, w: Math.max(1, maxR - minL), h: Math.max(1, maxB - minT) };
      if (prevScale) wrap.style.setProperty("--an-scale", prevScale);
      wrap.style.left = prevLeft; wrap.style.top = prevTop;
      return box;
    }

    function applyScale() {
      var avail = root.clientWidth || (root.parentNode && root.parentNode.clientWidth) || DESIGN_W;
      var b = measureBox();
      scale = Math.min(1, avail / b.w);
      wrap.style.setProperty("--an-scale", scale);
      wrap.style.left = (-b.x * scale + (avail - b.w * scale) / 2) + "px";
      wrap.style.top = (-b.y * scale) + "px";
      root.style.height = (b.h * scale) + "px";
    }
    applyScale();
    window.addEventListener("resize", applyScale);
    window.addEventListener("orientationchange", applyScale);
    var media = $(".an-media");
    var wave = $(".an-wave");
    var bars = Array.prototype.slice.call(wave.querySelectorAll("b"));
    var chat = $(".an-chat");
    var playBtn = $(".an-play");
    var muteBtn = $(".an-mute");
    var curEl = $(".an-cur");
    var durEl = $(".an-dur");
    var cta = $(".an-cta");
    var chans = Array.prototype.slice.call(wrap.querySelectorAll(".an-chan"));
    var connect = $(".an-connect");
    var stage = $(".an-stage");

    var muted = true, shown = -1, typing = null, finished = false;
    var fake = false, fakeT = 0, fakePlaying = false, lastFrame = 0, autoplayHooked = false;

    /* ---- connector lines + dots (channel pills -> phone) ---- */
    var BLUE = "#1668e3", GREEN = "#6dc10a";
    var ns = "http://www.w3.org/2000/svg";
    var paths = [], endDots = [], startDots = [], junction = null;

    function addConnector(lineColor, dotColor, opts) {
      opts = opts || {};
      var p = document.createElementNS(ns, "path");
      p.setAttribute("fill", "none");
      p.setAttribute("stroke", lineColor);
      p.setAttribute("stroke-width", "2");
      p.setAttribute("stroke-linecap", "round");
      p.setAttribute("stroke-dasharray", "3 5");
      p.setAttribute("opacity", "0.9");
      p.style.animation = "an-flow 1s linear infinite";
      connect.appendChild(p);
      paths.push(p);

      var sd = null;
      if (opts.startDot !== false) {
        sd = document.createElementNS(ns, "circle");
        sd.setAttribute("r", "3.5");
        sd.setAttribute("fill", lineColor);
        connect.appendChild(sd);
      }
      startDots.push(sd);

      var ed = null;
      if (opts.endDot !== false) {
        ed = document.createElementNS(ns, "circle");
        ed.setAttribute("r", "5");
        ed.setAttribute("fill", "#fff");
        ed.setAttribute("stroke", dotColor);
        ed.setAttribute("stroke-width", "2.5");
        connect.appendChild(ed);
      }
      endDots.push(ed);
    }

    function buildConnectors() {
      connect.innerHTML = "";
      paths = []; endDots = []; startDots = []; junction = null;
      /* 0: caller bubble -> phone (blue)
         1: Phone Calls & SMS pill -> phone (green)
         2: Website Chat -> junction
         3: WhatsApp -> junction
         4: Social Media -> junction
         5: junction -> phone */
      addConnector(BLUE, GREEN);
      addConnector(GREEN, BLUE);
      addConnector(GREEN, GREEN, { endDot: false });
      addConnector(GREEN, GREEN, { endDot: false });
      addConnector(BLUE, BLUE, { endDot: false });
      addConnector(BLUE, BLUE, { startDot: false });

      /* shared junction node where the three channel lines meet */
      junction = document.createElementNS(ns, "g");
      var halo = document.createElementNS(ns, "circle");
      halo.setAttribute("r", "7"); halo.setAttribute("fill", GREEN);
      halo.setAttribute("opacity", "0.28");
      var core = document.createElementNS(ns, "circle");
      core.setAttribute("r", "4.6"); core.setAttribute("fill", GREEN);
      var inner = document.createElementNS(ns, "circle");
      inner.setAttribute("r", "1.8"); inner.setAttribute("fill", "#fff");
      junction.appendChild(halo); junction.appendChild(core); junction.appendChild(inner);
      connect.appendChild(junction);
    }

    function drawConnectors() {
      var left = $(".an-left");
      if (!left || getComputedStyle(left).display === "none") return;
      var sRect = stage.getBoundingClientRect();
      if (sRect.width === 0) return;
      var k = scale || 1;
      var sw = sRect.width / k, sh = sRect.height / k;
      connect.setAttribute("viewBox", "0 0 " + sw + " " + sh);
      connect.setAttribute("width", sw);
      connect.setAttribute("height", sh);

      if (paths.length !== 6) buildConnectors();

      var phone = $(".an-phone");
      var pRect = phone.getBoundingClientRect();
      var endX = (pRect.left - sRect.left) / k;
      var phoneTop = (pRect.top - sRect.top) / k;
      var phoneH = pRect.height / k;

      function rightMid(el, fracY) {
        var r = el.getBoundingClientRect();
        return {
          x: (r.right - sRect.left) / k,
          y: (r.top - sRect.top) / k + (r.height / k) * (fracY || 0.5)
        };
      }
      function setPath(i, a, b, bulge) {
        var mX = (a.x + b.x) / 2 + (bulge || 0);
        paths[i].setAttribute("d", "M " + a.x + " " + a.y +
          " C " + mX + " " + a.y + ", " + mX + " " + b.y + ", " + b.x + " " + b.y);
        if (startDots[i]) { startDots[i].setAttribute("cx", a.x); startDots[i].setAttribute("cy", a.y); }
        if (endDots[i]) { endDots[i].setAttribute("cx", b.x); endDots[i].setAttribute("cy", b.y); }
      }

      /* bubble -> phone (upper area) */
      setPath(0, rightMid($(".an-caller-bubble")), { x: endX, y: phoneTop + phoneH * 0.2 }, 0);
      /* Phone Calls & SMS pill -> phone (mid area) */
      setPath(1, rightMid(chans[0]), { x: endX, y: phoneTop + phoneH * 0.42 }, 0);

      /* the three channel pills converge into one junction node */
      var wa = rightMid(chans[2]);
      var hub = { x: wa.x + Math.max(26, (endX - wa.x) * 0.38), y: wa.y };
      setPath(2, rightMid(chans[1]), hub, 18);
      setPath(3, wa, hub, 10);
      setPath(4, rightMid(chans[3]), hub, 18);
      /* junction -> phone */
      setPath(5, hub, { x: endX, y: phoneTop + phoneH * 0.72 }, 0);
      junction.setAttribute("transform", "translate(" + hub.x + "," + hub.y + ")");
    }

    buildConnectors();


    function duration() {
      if (fake) return CALL.fallbackDuration;
      return isFinite(media.duration) && media.duration ? media.duration : CALL.fallbackDuration;
    }
    function currentTime() { return fake ? fakeT : media.currentTime || 0; }
    function isPaused() { return fake ? !fakePlaying : media.paused; }

    timeLines(duration());

    /* rotating "live" highlight on the channel pills */
    var chanIdx = 0;
    setInterval(function () {
      chans.forEach(function (c, i) { c.classList.toggle("is-live", i === chanIdx); });
      chanIdx = (chanIdx + 1) % chans.length;
    }, 2200);

    function renderChat(force) {
      var t = currentTime(), n = -1;
      while (n + 1 < CALL.lines.length && t >= CALL.lines[n + 1].t) n++;
      var next = CALL.lines[n + 1];
      var typ = next && next.t - t < 1.6 && next.t - t > 0 ? next.who : null;
      if (!force && n === shown && typ === typing) return;
      shown = n; typing = typ;
      chat.innerHTML = CALL.lines.slice(0, shown + 1).map(function (l) {
        var av = '<img src="' + (l.who === "agent" ? CALL.icon : CALL.woman) + '" alt="" />';
        return '<div class="an-row ' + l.who + '"><span class="an-av">' + av + '</span>' +
          '<div class="an-bubble">' + esc(l.text) + "</div></div>";
      }).join("") + (typing ? '<div class="an-typing ' + typing + '"><i></i><i></i><i></i></div>' : "");
      chat.scrollTop = chat.scrollHeight;
    }

    function tick() {
      var d = duration();
      var pct = d ? currentTime() / d : 0;
      bars.forEach(function (b, i) {
        var on = i / BARS <= pct;
        b.classList.toggle("on", on);
        b.classList.toggle("mid", on && i / BARS > 0.4 && i / BARS < 0.62);
      });
      wave.setAttribute("aria-valuenow", Math.round(pct * 100));
      curEl.textContent = fmt(currentTime());
      durEl.textContent = fmt(d);
      renderChat(false);
    }

    function setPlayUI(playing) {
      playBtn.innerHTML = playing ? ICON.pause : ICON.play;
      playBtn.setAttribute("aria-label", playing ? "Pause call" : "Play call");
      wave.classList.toggle("playing", playing);
    }

    function fakeLoop(ts) {
      if (!fake || !fakePlaying) return;
      if (!lastFrame) lastFrame = ts;
      fakeT += (ts - lastFrame) / 1000;
      lastFrame = ts;
      if (fakeT >= duration()) { finished = true; fakePlaying = false; fakeT = 0; shown = -1; setPlayUI(false); tick(); return; }
      tick();
      requestAnimationFrame(fakeLoop);
    }
    function goFake() {
      if (fake) return;
      fake = true; timeLines(duration()); fakePlaying = true; lastFrame = 0;
      setPlayUI(true); requestAnimationFrame(fakeLoop); tick();
    }
    function play() {
      if (fake) { fakePlaying = true; lastFrame = 0; setPlayUI(true); requestAnimationFrame(fakeLoop); return; }
      var p = media.play();
      if (p && p.catch) p.catch(function () {});
    }
    function pause() {
      if (fake) { fakePlaying = false; setPlayUI(false); return; }
      media.pause();
    }

    function tryAutoplay() {
      media.muted = muted;
      play();
      ["loadeddata", "canplay", "canplaythrough"].forEach(function (ev) {
        media.addEventListener(ev, play, { once: true });
      });
      [150, 600, 1500].forEach(function (ms) {
        setTimeout(function () { if (!fake && media.paused) play(); }, ms);
      });
      if (!autoplayHooked) {
        autoplayHooked = true;
        var onGesture = function () { if (!fake && media.paused && !finished) play(); };
        ["pointerdown", "touchstart", "keydown", "scroll"].forEach(function (ev) {
          document.addEventListener(ev, onGesture, { passive: true });
        });
        document.addEventListener("visibilitychange", function () {
          if (!document.hidden && !fake && media.paused && !finished) play();
        });
      }
    }

    playBtn.addEventListener("click", function () { finished = false; isPaused() ? play() : pause(); });

    muteBtn.addEventListener("click", function () {
      muted = !muted;
      media.muted = muted;
      muteBtn.innerHTML = muted ? ICON.muted : ICON.sound;
      muteBtn.classList.toggle("is-active", !muted);
      muteBtn.classList.toggle("is-ringing", muted);
      muteBtn.setAttribute("aria-label", muted ? "Unmute call" : "Mute call");
      cta.classList.toggle("is-done", !muted);
      if (isPaused() && !finished) play();
    });

    function seekFromEvent(e) {
      var r = wave.getBoundingClientRect();
      var pct = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
      if (fake) fakeT = pct * duration();
      else if (media.duration) media.currentTime = pct * media.duration;
      shown = -1; tick();
    }
    wave.addEventListener("click", seekFromEvent);
    wave.addEventListener("keydown", function (e) {
      var step = e.key === "ArrowRight" ? 5 : e.key === "ArrowLeft" ? -5 : 0;
      if (!step) return;
      e.preventDefault();
      var t = Math.min(duration(), Math.max(0, currentTime() + step));
      if (fake) fakeT = t; else media.currentTime = t;
      shown = -1; tick();
    });

    media.addEventListener("loadedmetadata", function () { timeLines(duration()); renderChat(true); tick(); });
    media.addEventListener("timeupdate", function () { if (!fake) tick(); });
    media.addEventListener("play", function () { if (!fake) setPlayUI(true); });
    media.addEventListener("pause", function () { if (!fake) setPlayUI(false); });
    media.addEventListener("ended", function () { finished = true; media.currentTime = 0; shown = -1; setPlayUI(false); tick(); });
    media.addEventListener("error", goFake);

    media.muted = true;
    media.setAttribute("src", mediaSrc(CALL.audio));
    media.load();
    setTimeout(function () {
      if (!fake && !(isFinite(media.duration) && media.duration > 0)) goFake();
    }, 2500);

    renderChat(true);
    tick();
    tryAutoplay();

    /* connectors: draw + keep in sync on resize */
    function relayout() { applyScale(); drawConnectors(); }
    requestAnimationFrame(relayout);
    window.addEventListener("resize", relayout);
    window.addEventListener("orientationchange", function () { setTimeout(relayout, 250); });
    if (window.ResizeObserver) {
      new ResizeObserver(function () { relayout(); }).observe(root);
      new ResizeObserver(function () { drawConnectors(); }).observe(stage);
    }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
    window.addEventListener("load", relayout);
  }

  function boot() { document.querySelectorAll("[data-an-widget]").forEach(mount); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
</body>
