<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AnsweringNow.AI — Live Call Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Caveat:wght@600;700&display=swap" rel="stylesheet" />

<!-- ===================== CSS ===================== -->
<style>
/* Outer box: reserves space, centers the widget. */
.ancw-scaler { position: relative; width: 100%; max-width: 720px; margin: 0 auto; }

/* The widget is designed at a fixed 300px width and simply scaled.
   Mobile = an exact miniature/enlargement of the desktop UI. */
.ancw-wrap {
  --ancw-blue: #1668e3;
  --ancw-blue-deep: #0b3f96;
  --ancw-green: #6dc10a;
  --ancw-green-soft: #eaf8d8;
  --ancw-ink: #10233f;
  --ancw-muted: #7086a3;
  --ancw-line: #e4ebf5;
  --ancw-bubble-ai: #e8f1fe;
  --ancw-shell: #0e1622;
  --ancw-card: #ffffff;
  --ancw-red: #ff2d20;
  --ancw-font: "Inter", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;

  position: absolute; top: 0; left: 50%;
  width: 300px;                                   /* design width */
  transform: translateX(-50%) scale(var(--ancw-scale, 1));
  transform-origin: top center;
  font-family: var(--ancw-font);
  color: var(--ancw-ink);
}
.ancw-wrap *, .ancw-wrap *::before, .ancw-wrap *::after { box-sizing: border-box; }

/* Phone column (extra bottom space reserves room for the CTA note). */
.ancw-phone-col {
  position: relative; width: 250px; margin: 0 auto; padding-bottom: 74px;
}

.ancw-phone {
  position: relative; border-radius: 40px; padding: 8px;
  background: linear-gradient(160deg, #2b3442, var(--ancw-shell));
  box-shadow: 0 40px 70px -34px rgba(8,22,45,.75), 0 0 0 1px rgba(255,255,255,.06) inset;
}
.ancw-screen {
  position: relative; border-radius: 33px; background: var(--ancw-card);
  overflow: hidden; display: flex; flex-direction: column;
}

/* ---- status bar ---- */
.ancw-status {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 15px 3px; font-size: 11px; font-weight: 700;
}
.ancw-notch { width: 66px; height: 17px; border-radius: 999px; background: var(--ancw-shell); position: relative; left: 8px; }
.ancw-status-icons { display: flex; align-items: center; gap: 4px; }
.ancw-status-icons svg { width: 13px; height: 13px; }

/* ---- top bar ---- */
.ancw-topbar { display: grid; grid-template-columns: 28px minmax(0,1fr) 28px; align-items: center; gap: 6px; padding: 4px 12px 6px; }
.ancw-round {
  width: 28px; height: 28px; border: 0; border-radius: 999px;
  background: var(--ancw-bubble-ai); color: var(--ancw-blue);
  display: grid; place-items: center;
}
.ancw-round svg { width: 14px; height: 14px; }
.ancw-live { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13.5px; font-weight: 800; color: var(--ancw-blue); }
.ancw-live i { width: 8px; height: 8px; border-radius: 999px; background: var(--ancw-green); animation: ancw-pulse 1.6s ease-in-out infinite; }

/* ---- brand ---- */
.ancw-brand { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 4px 12px 6px; }
.ancw-brand-logo { display: block; height: 26px; width: auto; max-width: 100%; object-fit: contain; }
.ancw-badge {
  font-size: 10px; font-weight: 800; color: #3c6b12;
  background: var(--ancw-green-soft); border-radius: 999px; padding: 3px 40px; white-space: nowrap;
}

/* ---- transcript ---- */
.ancw-chat {
  flex: 1 1 auto; min-height: 0; height: 226px; overflow-y: auto;
  padding: 8px 11px; display: flex; flex-direction: column; gap: 8px; scrollbar-width: thin;
}
.ancw-chat::-webkit-scrollbar { width: 4px; }
.ancw-chat::-webkit-scrollbar-thumb { background: var(--ancw-line); border-radius: 999px; }
.ancw-row { display: flex; align-items: flex-end; gap: 6px; max-width: 95%; animation: ancw-in .32s ease both; }
.ancw-row.ancw-agent { align-self: flex-start; }
.ancw-row.ancw-caller { align-self: flex-end; flex-direction: row-reverse; }
.ancw-av { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 999px; display: grid; place-items: center; overflow: hidden; background: #fff; }
.ancw-av img { width: 100%; height: 100%; object-fit: cover; }
.ancw-row.ancw-agent .ancw-av img { object-fit: contain; }
.ancw-row.ancw-caller .ancw-av { box-shadow: 0 0 0 1px var(--ancw-line); }
.ancw-row.ancw-caller .ancw-av img { object-position: 50% 14%; }
.ancw-bubble { padding: 8px 11px; border-radius: 14px; font-size: 11.5px; line-height: 1.45; font-weight: 700; }
.ancw-row.ancw-agent .ancw-bubble { background: var(--ancw-bubble-ai); color: var(--ancw-blue-deep); border-bottom-left-radius: 6px; }
.ancw-row.ancw-caller .ancw-bubble { background: var(--ancw-green-soft); color: #2f4b12; border-bottom-right-radius: 6px; }
.ancw-typing { display: flex; gap: 5px; padding: 10px 12px; border-radius: 14px; }
.ancw-typing.ancw-agent { align-self: flex-start; background: var(--ancw-bubble-ai); }
.ancw-typing.ancw-caller { align-self: flex-end; background: var(--ancw-green-soft); }
.ancw-typing i { width: 6px; height: 6px; border-radius: 999px; background: var(--ancw-muted); animation: ancw-dot 1.1s infinite; }
.ancw-typing i:nth-child(2) { animation-delay: .15s; }
.ancw-typing i:nth-child(3) { animation-delay: .3s; }

/* ---- waveform ---- */
.ancw-wavebar { padding: 2px 12px; }
.ancw-wave { display: flex; align-items: center; gap: 2px; height: 38px; cursor: pointer; }
.ancw-wave b {
  display: block; flex: 1 1 auto; min-width: 2px; border-radius: 999px;
  background: rgba(22,104,227,.18); transform-origin: center; transition: background .15s linear;
}
.ancw-wave b.ancw-on { background: var(--ancw-blue); }
.ancw-wave b.ancw-on.ancw-mid { background: var(--ancw-green); }
.ancw-wave.ancw-playing b.ancw-on { animation: ancw-bar .62s ease-in-out infinite; }
.ancw-times {
  display: flex; justify-content: space-between; padding: 2px 2px 0;
  font: 700 9.5px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
  color: var(--ancw-muted); font-variant-numeric: tabular-nums;
}

/* ---- controls ---- */
.ancw-controls { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 8px 12px 16px; }
.ancw-ctl {
  width: 44px; height: 44px; border: 0; border-radius: 999px;
  background: var(--ancw-bubble-ai); color: var(--ancw-blue);
  display: grid; place-items: center; cursor: pointer;
  transition: transform .18s ease, background .18s ease, color .18s ease;
}
.ancw-ctl svg { width: 21px; height: 21px; }
.ancw-ctl:hover { transform: translateY(-2px) scale(1.04); }
.ancw-ctl:focus-visible { outline: 3px solid rgba(22,104,227,.35); outline-offset: 3px; }
.ancw-ctl.ancw-is-active { background: var(--ancw-blue); color: #fff; }
.ancw-ctl.ancw-is-play { background: var(--ancw-green); color: #fff; }
.ancw-ctl.ancw-is-end { background: #f0453a; color: #fff; cursor: default; }
.ancw-ctl.ancw-is-end:hover { transform: none; }
.ancw-ctl.ancw-is-ringing { position: relative; }
.ancw-ctl.ancw-is-ringing::after {
  content: ""; position: absolute; inset: -4px; border-radius: 999px;
  border: 2px solid rgba(255,45,32,.6); animation: ancw-ping 1.6s ease-out infinite;
}

/* ---- "Unmute" hand-written note ---- */
.ancw-cta {
  position: absolute; top: 100%; left: 50%; margin-top: 12px;
  transform: translateX(-50%) translate(-80px, -103px);
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  z-index: 3; pointer-events: none; color: var(--ancw-red); width: 86%;
}
.ancw-cta svg { display: block; width: 58px; height: 64px; }
.ancw-cta svg path { stroke-dasharray: 240; stroke-dashoffset: 240; animation: ancw-draw 1.4s ease forwards .4s; }
.ancw-cta span {
  display: block; font-family: "Caveat", "Segoe Script", cursive;
  font-size: 28.8px; font-weight: 700; line-height: 1.05; text-align: center;
  transform: rotate(-3deg); text-shadow: 0 2px 10px rgba(255,45,32,.18);
  position: relative; left: 76px; bottom: 22px;
}
.ancw-cta.ancw-is-done { opacity: 0; transition: opacity .4s ease; }

/* hidden audio element */
.ancw-media { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

/* ---- animations ---- */
@keyframes ancw-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes ancw-dot { 0%,60%,100% { opacity: .3; } 30% { opacity: 1; } }
@keyframes ancw-ping { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(1.32); opacity: 0; } }
@keyframes ancw-bar { 0%,100% { transform: scaleY(.7); } 50% { transform: scaleY(1.3); } }
@keyframes ancw-pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes ancw-draw { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .ancw-wrap * { animation: none !important; } }
@media (hover: none) {
  .ancw-ctl:hover { transform: none; }
  .ancw-ctl:active { transform: scale(.94); }
}
</style>

</head>
<body style="margin:0;background:#fff;padding:24px 12px;font-family:Inter,system-ui,sans-serif">

<!-- ===================== HTML =====================
     Everything is plain markup — edit text/icons right here. -->
<div class="ancw-scaler" id="ancw">
  <div class="ancw-wrap">
    <div class="ancw-phone-col">
      <div class="ancw-phone">
        <div class="ancw-screen">

          <!-- status bar -->
          <div class="ancw-status">
            <span>9:41</span>
            <span class="ancw-notch"></span>
            <span class="ancw-status-icons">
              <svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="14" width="3" height="6" rx="1"/><rect x="7" y="11" width="3" height="9" rx="1"/><rect x="12" y="8" width="3" height="12" rx="1"/><rect x="17" y="5" width="3" height="15" rx="1"/></svg>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 9a14 14 0 0 1 18 0"/><path d="M6.5 12.8a9 9 0 0 1 11 0"/><path d="M10 16.5a4 4 0 0 1 4 0"/><circle cx="12" cy="19.6" r="1.1" fill="currentColor"/></svg>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="17" height="9" rx="2.6" fill="currentColor"/><path d="M21.5 11.5v2"/></svg>
            </span>
          </div>

          <!-- top bar -->
          <div class="ancw-topbar">
            <span class="ancw-round"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6l-6 6 6 6"/></svg></span>
            <span class="ancw-live"><i></i>Live Call</span>
            <span class="ancw-round"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></span>

            <span class="ancw-ctl" role="img" aria-label="Keypad (demo)"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="6" r="1.7"/><circle cx="12" cy="6" r="1.7"/><circle cx="18" cy="6" r="1.7"/><circle cx="6" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18" cy="12" r="1.7"/><circle cx="6" cy="18" r="1.7"/><circle cx="12" cy="18" r="1.7"/><circle cx="18" cy="18" r="1.7"/></svg></span>
            <span class="ancw-ctl ancw-is-end" role="img" aria-label="End call (demo)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 8.5c-3 0-5.9.7-8.2 2-1 .6-1.3 1.9-.7 2.8l.9 1.3c.5.7 1.4.9 2.2.6l2.2-.9c.7-.3 1.1-1 1.1-1.7v-1c1.6-.4 3.4-.4 5 0v1c0 .8.4 1.4 1.1 1.7l2.2.9c.8.3 1.7.1 2.2-.6l.9-1.3c.6-.9.3-2.2-.7-2.8-2.3-1.3-5.2-2-8.2-2z"/></svg></span>
          </div>

        </div>

      <!-- unmute note -->
      <div class="ancw-cta">

        <span>Unmute to hear<br>sample call</span>
      </div>
    </div>

    <!-- CALL RECORDING: change the src to swap the mp3 -->
    <audio class="ancw-media" src="hair-stylist-audio.mp3" preload="auto" muted playsinline></audio>
  </div>
</div>

<!-- ===================== JS ===================== -->
<script>
(function () {
  "use strict";

  /* ---------- 1. AVATARS (change the image paths here) ---------- */
  var AVATAR = {
    agent:  "AnsweringNowAI-Logo-Icon.jpg",
    caller: "caller-woman.png"
  };

  /* ---------- 2. TRANSCRIPT ----------
     t = seconds into the mp3 when the line appears. */
  var LINES = [
    { t: 0,  who: "agent",  text: "Thank you for calling Bella Hair Studio. I'm Ashley, the AI Receptionist for Bella. She is currently with a client or not available right now, but I can help answer any questions about our services and pricing, check availability or even book an appointment for you. How can I help you today?" },
    { t: 18, who: "caller", text: "Hi, I'm looking for a new hairstylist and I wanted to ask about getting highlights." },
    { t: 22, who: "agent",  text: "Absolutely. I'd love to help. Are you looking for full highlights, partial highlights or something like a balayage?" },
    { t: 29, who: "caller", text: "I'm thinking of balayage. I want something natural, but a little lighter." },
    { t: 33, who: "agent",  text: "A balayage would be a great option for that. It gives you a softer, more natural look and grows out nicely. Is your hair currently colored?" },
    { t: 42, who: "caller", text: "Yes, but it's been about six months since I had anything done." },
    { t: 45, who: "agent",  text: "Okay, I see." },
    { t: 46, who: "caller", text: "Oh, by the way, how much does balayage cost?" },
    { t: 49, who: "agent",  text: "Our balayage services start at $175. The final price can vary depending on your hair length, thickness and what you'd like to achieve. Your stylist will go over everything with you before getting started." },
    { t: 62, who: "caller", text: "Okay, that sounds good. Do you have anything available Saturday?" },
    { t: 65, who: "agent",  text: "Let me check the schedule for you. We have an opening Saturday at 11am or 2:30pm." },
    { t: 70, who: "caller", text: "Can I do 11?" },
    { t: 71, who: "agent",  text: "Absolutely. I can reserve that for you. May I get your name?" },
    { t: 75, who: "caller", text: "It's Jennifer." },
    { t: 76, who: "agent",  text: "Thanks, Jennifer. And what's the best phone number for your appointment confirmation?" },
    { t: 80, who: "caller", text: "It's 555-818-1234." },
    { t: 84, who: "agent",  text: "Perfect. I have you scheduled for Saturday at 11am for a balayage appointment. Great. Thank you so much. You're very welcome, Jennifer. We look forward to seeing you Saturday. Is there anything else I can help you with?" },
    { t: 96, who: "caller", text: "Nope, that's it." },
    { t: 97, who: "agent",  text: "Great. Thanks for calling Bella Hair Studio. Have a wonderful day. You too. Bye. Goodbye." }
  ];

  /* ---------- 3. SETUP ---------- */
  var root  = document.getElementById("ancw");
  var wrap  = root.querySelector(".ancw-wrap");
  var media = root.querySelector(".ancw-media");
  var chat  = root.querySelector(".ancw-chat");
  var wave  = root.querySelector(".ancw-wave");
  var curEl = root.querySelector(".ancw-cur");
  var durEl = root.querySelector(".ancw-dur");
  var playBtn = root.querySelector(".ancw-play");
  var muteBtn = root.querySelector(".ancw-mute");
  var cta   = root.querySelector(".ancw-cta");

  var ICON = {
    play:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2c0-.9 1-1.5 1.8-1L19 11c.7.5.7 1.5 0 2l-9.2 6c-.8.5-1.8-.1-1.8-1z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.4"/><rect x="13.5" y="5" width="4" height="14" rx="1.4"/></svg>',
    sound: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 9H3v6h3.5L11 19z"/><path d="M16 9.2a4 4 0 0 1 0 5.6"/><path d="M18.8 6.5a8 8 0 0 1 0 11"/></svg>',
    muted: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 9H3v6h3.5L11 19z"/><path d="m16 9.5 5 5"/><path d="m21 9.5-5 5"/></svg>'
  };
  playBtn.innerHTML = ICON.play;
  muteBtn.innerHTML = ICON.muted;

  /* ---------- 4. MOBILE SCALING (design width 300px) ---------- */
  var DESIGN_W = 300;
  function fit() {
    var avail = root.clientWidth || DESIGN_W;
    var scale = avail >= 720 ? 1 : Math.min(1.1, avail / DESIGN_W);
    wrap.style.setProperty("--ancw-scale", scale);
    root.style.height = wrap.offsetHeight * scale + "px";
  }
  fit();
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", fit);

  /* ---------- 5. WAVEFORM BARS ---------- */
  var BARS = 52, barsHTML = "";
  for (var i = 0; i < BARS; i++) {
    var w = Math.sin(i * 0.55) * Math.cos(i * 0.19) * Math.sin(i * 0.09 + 1);
    barsHTML += '<b style="height:' + Math.round(8 + Math.abs(w) * 28) + "px;animation-delay:" + ((i % 7) * 0.09).toFixed(2) + 's"></b>';
  }
  wave.innerHTML = barsHTML;
  var bars = [].slice.call(wave.children);

  /* ---------- 6. TRANSCRIPT SYNC ---------- */
  var shown = -1, typing = null;

  /* rough end-of-speech per line, so the "typing" dots only show in silence */
  function lineEnd(i) {
    var l = LINES[i], next = LINES[i + 1];
    var spoken = l.t + (l.text.split(/\s+/).length / 2.75) + 0.35;
    var limit = next ? next.t - 0.15 : (media.duration || 105);
    return Math.max(l.t + 0.4, Math.min(spoken, limit));
  }

  function esc(s) {
    return s.replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function renderChat(t, force) {
    var n = -1;
    while (n + 1 < LINES.length && t >= LINES[n + 1].t) n++;
    var next = LINES[n + 1], typ = null;
    if (next) {
      var gapStart = n >= 0 ? lineEnd(n) : 0;
      if (next.t - gapStart >= 0.4 && t >= gapStart && next.t - t <= 1.2) typ = next.who;
    }
    if (!force && n === shown && typ === typing) return;
    shown = n; typing = typ;
    chat.innerHTML = LINES.slice(0, n + 1).map(function (l) {
      return '<div class="ancw-row ancw-' + l.who + '">' +
             '<span class="ancw-av"><img src="' + AVATAR[l.who] + '" alt="" /></span>' +
             '<div class="ancw-bubble">' + esc(l.text) + "</div></div>";
    }).join("") + (typ ? '<div class="ancw-typing ancw-' + typ + '"><i></i><i></i><i></i></div>' : "");
    chat.scrollTop = chat.scrollHeight;
  }

  /* ---------- 7. PLAYBACK UI ---------- */
  function fmt(s) {
    if (!isFinite(s) || s < 0) s = 0;
    return Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
  }

  function tick() {
    var d = media.duration || 0, t = media.currentTime || 0;
    var pct = d ? t / d : 0;
    bars.forEach(function (b, i) {
      var on = i / BARS <= pct;
      b.classList.toggle("ancw-on", on);
      b.classList.toggle("ancw-mid", on && i / BARS > 0.4 && i / BARS < 0.62);
    });
    wave.setAttribute("aria-valuenow", Math.round(pct * 100));
    curEl.textContent = fmt(t);
    durEl.textContent = fmt(d);
    renderChat(t, false);
    if (!media.paused) requestAnimationFrame(tick);
  }

  function setPlayUI(playing) {
    playBtn.innerHTML = playing ? ICON.pause : ICON.play;
    playBtn.setAttribute("aria-label", playing ? "Pause call" : "Play call");
    wave.classList.toggle("ancw-playing", playing);
  }

  function play() { var p = media.play(); if (p && p.catch) p.catch(function () {}); }

  media.addEventListener("play", function () { setPlayUI(true); tick(); });
  media.addEventListener("pause", function () { setPlayUI(false); tick(); });
  media.addEventListener("loadedmetadata", function () { shown = -1; tick(); });
  media.addEventListener("ended", function () { media.currentTime = 0; shown = -1; setPlayUI(false); tick(); });

  playBtn.addEventListener("click", function () { media.paused ? play() : media.pause(); });

  muteBtn.addEventListener("click", function () {
    media.muted = !media.muted;
    muteBtn.innerHTML = media.muted ? ICON.muted : ICON.sound;
    muteBtn.classList.toggle("ancw-is-active", !media.muted);
    muteBtn.classList.toggle("ancw-is-ringing", media.muted);
    muteBtn.setAttribute("aria-label", media.muted ? "Unmute call" : "Mute call");
    cta.classList.toggle("ancw-is-done", !media.muted);
    if (media.paused) play();
  });

  /* seek: click the waveform, or arrow keys when focused */
  wave.addEventListener("click", function (e) {
    var r = wave.getBoundingClientRect();
    media.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * (media.duration || 0);
    shown = -1; tick();
  });
  wave.addEventListener("keydown", function (e) {
    var step = e.key === "ArrowRight" ? 5 : e.key === "ArrowLeft" ? -5 : 0;
    if (!step) return;
    e.preventDefault();
    media.currentTime = Math.min(media.duration || 0, Math.max(0, media.currentTime + step));
    shown = -1; tick();
  });

  /* muted autoplay; retried on the visitor's first interaction */
  media.muted = true;
  play();
  document.addEventListener("pointerdown", function once() {
    if (media.paused) play();
    document.removeEventListener("pointerdown", once);
  }, { passive: true });

  renderChat(0, true);
  tick();
})();
</script>
</body>
</html>
